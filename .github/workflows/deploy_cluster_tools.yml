name: Deploy Cluster Tools

on:
  workflow_dispatch: 
    inputs:
      env_type:
        description: "Environment type"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      env_number:
        description: "K8S environment (cluster) number (e.g. 1 or 01 for dev-01, 2 or 02 for dev-02)"
        required: true
        type: string          

permissions:
  contents: read
  id-token: write   # REQUIRED for Workload Identity Federation

env:
  TF_VAR_project_id: ${{ vars.PROJECT_ID}}
  TF_VAR_region: ${{ vars.REGION }}
  TF_VAR_runner_service_account: ${{ vars.runner_service_account}}
  TF_VAR_env_type: ${{ inputs.env_type }}
  TF_VAR_env_number: ${{inputs.env_number}}


jobs:
  terraform:
    name: deploy_cluster_tools
    runs-on: self-hosted

    defaults:
      run:
        working-directory: terraform/gcp

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate K8S environment (cluster) name
        run: |
          env_name="${{inputs.env_type}}-${{inputs.env_number}}"

          if [[ ! "$env_name" =~ ^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$ ]]; then
            echo "❌ Invalid K8S cluster name"
            echo "Rules:"
            echo " - 1–40 characters"
            echo " - lowercase letters, numbers, hyphens"
            echo " - must start with a letter"
            echo " - must not end with a hyphen"
            exit 1
          fi

          echo "✅ K8S cluster name is valid: $env_name"

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.PROJECT_ID }}
          workload_identity_provider: projects/${{vars.PROJECT_NUMBER}}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{vars.runner_service_account}}@${{vars.PROJECT_ID}}.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14

      - name: Debug OIDC token
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket= github-k8s-terraform-state" \
            -backend-config="prefix=${{ inputs.env_type }}/${{ inputs.env_number }}"

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin
          
      - name: Get K8S credentials
        run: |
          gcloud container clusters get-credentials \
            ${{inputs.env_type}}-${{inputs.env_number}} \
            --location $(terraform output -raw cluster_location) \
            --project ${{ vars.PROJECT_ID }}

      - name: Verify cluster access
        run: |
          kubectl version 
          kubectl get nodes            
      
      - name: Install / Upgrade Argo CD
        run: |
          helm upgrade --install argocd \
            oci://ghcr.io/argoproj/argo-helm/argo-cd \
            --namespace argocd \
            --create-namespace \
            --wait \
            --wait-for-jobs \
            --timeout 20m \
            --set server.service.type=LoadBalancer
#           --version 7.7.0 \

      - name: Wait for ArgoCD LoadBalancer
        run: |
          echo "Waiting for ArgoCD LoadBalancer external IP..."
          for i in {1..60}; 
          do
            EXTERNAL_IP_or_DNS=$(kubectl get svc -n argocd  argocd-server  \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}{.status.loadBalancer.ingress[0].hostname}')
      
            if [ -n "$EXTERNAL_IP_or_DNS" ]; then
              echo "LoadBalancer ready: $EXTERNAL_IP_or_DNS"
              exit 0
            fi
      
            sleep 10
          done
      
          echo "Timed out waiting for LoadBalancer"
          exit 1
