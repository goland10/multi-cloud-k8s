name: Multi-cluster K8S Deploy

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: "Cloud"
        required: true
        type: choice
        default: "AWS"
        options:
          - GCP
          - AWS
      env_type:
        description: "Environment type (tfvars file name must adhere to 'env_type-env_number.tfvars')"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      env_number:
        description: "K8S environment (cluster) number (e.g. 01 for dev-01, 02 for dev-02)"
        required: true
        type: string
      endpoint_access:
        description: "Control plane endpoint access [AWS only]"
        required: false
        type: choice
        default: "public"
        options:
          - public
          - private

permissions:
  contents: read
  id-token: write   # Required for OIDC (both GCP WIF and AWS OIDC)

jobs:
  # ─────────────────────────────────────────────
  # Shared validation (runs for both clouds)
  # ─────────────────────────────────────────────
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate K8S cluster name
        run: |
          env_name="${{ inputs.env_type }}-${{ inputs.env_number }}"

          if [[ ! "$env_name" =~ ^[a-z]([-a-z0-9]{0,38}[a-z0-9])?$ ]]; then
            echo "❌ Invalid K8S cluster name: $env_name"
            echo "Rules:"
            echo " - 1–40 characters"
            echo " - lowercase letters, numbers, hyphens"
            echo " - must start with a letter"
            echo " - must not end with a hyphen"
            exit 1
          fi
          echo "✅ K8S cluster name is valid: $env_name"

  # ─────────────────────────────────────────────
  # AWS / EKS - Public endpoint
  # ─────────────────────────────────────────────
  terraform-aws-public:
    name: "Terraform [AWS/EKS/Public]"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.cloud == 'AWS' && inputs.endpoint_access == 'public'

    defaults:
      run:
        working-directory: ./aws/terraform/public

    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_env_type: ${{ inputs.env_type }}
      TF_VAR_env_number: ${{ inputs.env_number }}
      TF_VAR_endpoint_access: ${{ inputs.endpoint_access }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ inputs.env_type }}/${{ inputs.env_number }}/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -var-file="../envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -var="private_cluster=false" \
            -out=tfplan

#      - name: Stop workflow
#        run: |
#          echo "Intentional stop"
#          exit 1
#
#      - name: Terraform Apply
#        if: github.ref == 'refs/heads/main'
#        run: |
#          terraform apply \
#            -auto-approve \
#            tfplan

  # ─────────────────────────────────────────────
  # AWS / EKS - Private endpoint
  # ─────────────────────────────────────────────
  terraform-aws-private:
    name: "Terraform [AWS/EKS/Private]"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.cloud == 'AWS' && inputs.endpoint_access == 'private'

    defaults:
      run:
        working-directory: ./aws/terraform/private

    env:
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_env_type: ${{ inputs.env_type }}
      TF_VAR_env_number: ${{ inputs.env_number }}
      TF_VAR_endpoint_access: ${{ inputs.endpoint_access }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ inputs.env_type }}/${{ inputs.env_number }}/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -var-file="../envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -auto-approve \
            tfplan

  # ─────────────────────────────────────────────
  # GCP / GKE Job
  # ─────────────────────────────────────────────
  terraform-gcp:
    name: "Terraform [GCP/GKE]"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.cloud == 'GCP'

    defaults:
      run:
        working-directory: gcp

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
      TF_VAR_env_type: ${{ inputs.env_type }}
      TF_VAR_env_number: ${{ inputs.env_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="prefix=${{ inputs.env_type }}/${{ inputs.env_number }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -var-file="./envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -var-file="./envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -auto-approve \
            tfplan


