name: Multi-cluster K8S Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform"
        required: true
        type: choice
        default: "test-only"
        options:
          - deploy
          - destroy
          - test-only
      cloud:
        description: "Cloud"
        required: true
        type: choice
        default: "AWS"
        options:
          - GCP
          - AWS
      env_type:
        description: "Environment type (tfvars file name must adhere to 'env_type-env_number.tfvars'. ex. 'dev-01.tfvars')"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
      env_number:
        description: "K8S environment (cluster) number (e.g. 01 for dev-01, 02 for dev-02)"
        required: true
        type: string
      endpoint_access:
        description: "Control plane endpoint access [AWS only]"
        required: false
        type: choice
        default: "public"
        options:
          - public
          - private

defaults:
  run:
    shell: bash

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
permissions:
  contents: read
  id-token: write   # Required for OIDC (both GCP WIF and AWS OIDC)

jobs:
  # ─────────────────────────────────────────────
  # Shared validation (runs for both clouds)
  # ─────────────────────────────────────────────
  validate:
    name: Validate Inputs
    runs-on: ubuntu-latest
    steps:
      - name: Validate Environment Number Range
        run: |
          ENV_NUM="${{ inputs.env_number }}"
          echo "Validating environment number: $ENV_NUM"
          
          # Match exactly two digits from 01 to 99
          if [[ ! "$ENV_NUM" =~ ^[0-9]{2}$ ]] || [ "$ENV_NUM" = "00" ]; then
            echo "❌ Error: env_number must be a two-digit integer zero-padded between 01 and 99 (e.g., 01, 02, 15)."
            echo "Received: '$ENV_NUM'"
            exit 1
          fi
          
          echo "✅ Input format verified successfully."
          
  # ─────────────────────────────────────────────
  # AWS / EKS Job
  # ─────────────────────────────────────────────
  terraform-aws:
    name: "Terraform [AWS/EKS ${{ inputs.endpoint_access }} Endpoints Setup]"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.cloud == 'AWS' && inputs.action != 'test-only'
    
    defaults:
      run:
        # Use the input to pick the right directory dynamically
        working-directory: ./aws/terraform/${{ inputs.endpoint_access }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="key=${{ inputs.endpoint_access }}/${{ inputs.env_type }}/${{ inputs.env_number }}/terraform.tfstate" # ex. public/dev/01/terraform.tfstate

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'deploy'
        run: |
          terraform plan \
            -var-file="../envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="endpoint_access=${{ inputs.endpoint_access }}" \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'deploy' && github.ref == 'refs/heads/main'
        run: |
          terraform apply \
          -auto-approve \
          tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: |
          terraform destroy \
            -var-file="../envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -var="region=${{ vars.AWS_REGION }}" \
            -var="endpoint_access=${{ inputs.endpoint_access }}" \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -auto-approve

  test-aws-cluster:
    name: "Test AWS EKS Cluster Connectivity"
    runs-on: ubuntu-latest
    needs: terraform-aws
    # always() forces GitHub to evaluate this condition even if terraform-aws was skipped
    if: |
      always() &&
      (inputs.action == 'test-only' || inputs.action == 'deploy') &&
      inputs.cloud == 'AWS'
    env:
      CLUSTER_NAME: ${{ inputs.env_type }}-${{ inputs.env_number }}
      # Store this as a boolean flag for easy step-level condition checks
      IS_PRIVATE: ${{ inputs.endpoint_access == 'private' }}
    steps:
      # ─────────────────────────────────────────────────────────────
      # SHARED STEPS (Steps 1-3)
      # ─────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Get kubeconfig
        run: |
          aws eks update-kubeconfig --name $CLUSTER_NAME --region ${{ vars.AWS_REGION }}

      # ─────────────────────────────────────────────────────────────
      # PRIVATE TUNNEL STEPS (Only runs if access is 'private')
      # ─────────────────────────────────────────────────────────────
      - name: Fetch Bastion Instance ID
        if: env.IS_PRIVATE == 'true'
        id: get-bastion
        run: |
          BASTION_NAME="${CLUSTER_NAME}-bastion"
          echo "Looking up Instance ID for: $BASTION_NAME"
          BASTION_INSTANCE_ID=$(aws ec2 describe-instances \
            --region ${{ vars.AWS_REGION }} \
            --filters "Name=tag:Name,Values=$BASTION_NAME" "Name=instance-state-name,Values=running" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text)
            
          if [ -z "$BASTION_INSTANCE_ID" ]; then
            echo "❌ Error: No running bastion instance found with tag Name=$BASTION_NAME"
            exit 1
          fi
          echo "✅ Found Bastion ID: $BASTION_INSTANCE_ID"
          echo "BASTION_INSTANCE_ID=$BASTION_INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Generate Ephemeral SSH Key Pair
        if: env.IS_PRIVATE == 'true'
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          ssh-keygen -t ed25519 -N "" -f "$HOME/.ssh/bastion"
          chmod 600 "$HOME/.ssh/bastion"

      - name: Send SSH Public Key via EICE
        if: env.IS_PRIVATE == 'true'
        run: |
          BASTION_INSTANCE_ID="${{ steps.get-bastion.outputs.BASTION_INSTANCE_ID }}"
          aws ec2-instance-connect send-ssh-public-key \
            --region ${{ vars.AWS_REGION }} \
            --instance-os-user ec2-user \
            --instance-id "$BASTION_INSTANCE_ID" \
            --ssh-public-key "file://$HOME/.ssh/bastion.pub"

      - name: Start SSH Tunnel via Bastion
        if: env.IS_PRIVATE == 'true'
        run: |
          # Extract the internal EKS endpoint hostname from the local kubeconfig
          EKS_ENDPOINT=$(kubectl config view --minify --output jsonpath='{.clusters[0].cluster.server}')
          EKS_HOST="${EKS_ENDPOINT#https://}"
          BASTION_INSTANCE_ID="${{ steps.get-bastion.outputs.BASTION_INSTANCE_ID }}"
          
          # Start a local background port-forwarding tunnel using standard SSH
          echo "Establishing secure bridge to private EKS API endpoint..."
          ssh -i "$HOME/.ssh/bastion" -fNML 6443:${EKS_HOST}:443 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ProxyCommand="aws ec2-instance-connect open-tunnel --region ${{ vars.AWS_REGION }} --instance-id $BASTION_INSTANCE_ID" \
            ec2-user@$BASTION_INSTANCE_ID
          sleep 3

      # ─────────────────────────────────────────────────────────────
      # DYNAMIC EXECUTION (Applies arguments conditionally)
      # ─────────────────────────────────────────────────────────────
      - name: Test Cluster is Operational (run kubectl)
        run: |
          # If private, append the secure local port overrides. If public, leave empty.
          if [ "$IS_PRIVATE" = "true" ]; then
            KUBECTL_ARGS="--server=https://localhost:6443 --insecure-skip-tls-verify=true"
          else
            KUBECTL_ARGS=""
          fi

          printf "Get cluster nodes...\n\n"
          kubectl get nodes -o wide $KUBECTL_ARGS
          
          printf "\nGet pods across all namespaces...\n\n"
          kubectl get pods -Ao wide $KUBECTL_ARGS
          
  # ─────────────────────────────────────────────
  # GCP / GKE Job
  # ─────────────────────────────────────────────
  terraform-gcp:
    name: "Terraform [GCP/GKE]"
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.cloud == 'GCP' && inputs.action != 'test-only'

    defaults:
      run:
        working-directory: ./gcp

    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION }}
      TF_VAR_runner_service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}
      TF_VAR_env_type: ${{ inputs.env_type }}
      TF_VAR_env_number: ${{ inputs.env_number }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ${{ vars.GCP_RUNNER_SERVICE_ACCOUNT }}@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="prefix=${{ inputs.env_type }}/${{ inputs.env_number }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: inputs.action == 'deploy'
        run: |
          terraform plan \
            -var-file="./envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'deploy' && github.ref == 'refs/heads/main'
        run: |
          terraform apply \
            -auto-approve \
            tfplan

      - name: Terraform Destroy
        if: inputs.action == 'destroy' && github.ref == 'refs/heads/main'
        run: |
          terraform destroy \
            -var-file="./envs/${{ inputs.env_type }}-${{ inputs.env_number }}.tfvars" \
            -var="env_type=${{ inputs.env_type }}" \
            -var="env_number=${{ inputs.env_number }}" \
            -auto-approve

